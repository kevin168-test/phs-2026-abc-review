<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公衛師複習系統 2.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <div id="app">
        <!-- Loading Screen -->
        <div id="loader" class="view">
            <div class="spinner"></div>
            <p>正在初始化題庫...</p>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="view hidden">
            <header>
                <h1>公衛師複習 2.0</h1>
                <p>國考模擬模式：40題 / 40分鐘</p>
            </header>
            
            <div class="subject-grid" id="subject-list">
                <!-- Subjects injected here -->
            </div>

            <div class="stats-area">
                <button id="btn-review-mistakes" class="mode-card mistake">
                    <span class="icon">📝</span>
                    <span class="label">錯題重測 (複習模式)</span>
                    <span class="count" id="mistake-count">0</span>
                </button>
            </div>
        </div>

        <!-- Quiz View -->
        <div id="quiz-view" class="view hidden">
            <nav class="quiz-nav">
                <button id="btn-exit-quiz">✕</button>
                <div id="quiz-timer" class="timer">40:00</div>
                <div class="progress-container">
                    <div id="progress-bar" style="width: 0%;"></div>
                </div>
                <span id="progress-text">1/40</span>
            </nav>

            <div id="question-container">
                <!-- Question injected here -->
            </div>

            <footer class="quiz-footer">
                <button id="btn-prev-question" class="nav-btn">上一題</button>
                <button id="btn-next-question" class="nav-btn">下一題</button>
                <button id="btn-submit-quiz" class="submit-btn hidden">提交卷子</button>
            </footer>
        </div>

        <!-- Result View -->
        <div id="result-view" class="view hidden">
            <div class="result-header">
                <h2>測驗結果</h2>
                <div class="score-circle">
                    <span id="score-text">0</span>
                    <small>/ 40</small>
                </div>
                <p id="result-time">耗時：00:00</p>
            </div>
            <div id="result-list" class="result-list"></div>
            <button class="home-btn" onclick="location.reload()">回到首頁</button>
        </div>
    </div>

    <script src="lib/dexie.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
